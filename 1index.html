<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyluna Kids - Belajar Sambil Bermain!</title>
  <style>
    /* --- CSS VARIABLES & RESET --- */
    :root {
      --primary-bg: #f8fbff;
      --text-main: #2d3748;
      --text-light: #718096;
      --math-color: #4299e1;
      --english-color: #9f7aea;
      --basic-color: #48bb78;
      --btn-hover: rgba(0,0,0,0.05);
      --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
      --font-main: 'Nunito', 'Segoe UI', 'Comic Sans MS', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: var(--font-main);
      background-color: var(--primary-bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- LAYOUT & SCREENS --- */
    #app-container {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: white;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 30px 20px;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: flex; }

    /* --- TYPOGRAPHY & HEADER --- */
    h1 { font-size: 2.2rem; text-align: center; color: #2d3748; margin-bottom: 5px; }
    .subtitle { text-align: center; font-size: 1.1rem; color: var(--text-light); margin-bottom: 30px; }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      background: #edf2f7; border: none; padding: 10px 15px;
      border-radius: 12px; font-size: 1rem; cursor: pointer;
      font-weight: bold; color: #4a5568; transition: 0.2s;
    }
    .back-btn:active { transform: scale(0.95); }

    /* --- HOME & CATEGORIES --- */
    .hero-icon { font-size: 5rem; text-align: center; margin: 20px 0; animation: float 3s ease-in-out infinite; }
    
    .category-card {
      background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px;
      cursor: pointer; display: flex; align-items: center; gap: 20px;
      box-shadow: var(--card-shadow); border: 3px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .category-card:active { transform: scale(0.98); }
    .category-card.math { border-color: #ebf8ff; background: #ebf8ff; }
    .category-card.english { border-color: #faf5ff; background: #faf5ff; }
    .category-card.basic { border-color: #f0fff4; background: #f0fff4; }
    
    .cat-icon { font-size: 3rem; }
    .cat-info h2 { font-size: 1.5rem; margin-bottom: 4px; }
    .cat-info p { font-size: 1rem; color: var(--text-light); }
    
    .math h2 { color: var(--math-color); }
    .english h2 { color: var(--english-color); }
    .basic h2 { color: var(--basic-color); }

    /* --- LEVEL SELECT --- */
    .level-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 10px;
    }
    .level-btn {
      aspect-ratio: 1; border-radius: 16px; border: none; font-size: 1.5rem;
      font-weight: bold; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #edf2f7; color: #a0aec0;
      transition: 0.2s; position: relative;
    }
    .level-btn.unlocked { background: white; color: var(--text-main); box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #e2e8f0; }
    .level-btn.unlocked:active { transform: scale(0.95); }
    .stars-display { font-size: 0.8rem; margin-top: 5px; letter-spacing: 2px; }

    /* --- GAMEPLAY --- */
    .progress-bar-container { width: 100%; height: 12px; background: #edf2f7; border-radius: 10px; overflow: hidden; margin-bottom: 30px; }
    .progress-bar { height: 100%; background: #48bb78; width: 0%; transition: width 0.3s ease; }
    
    .question-container { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .question-text { font-size: 2.5rem; font-weight: bold; margin-bottom: 30px; line-height: 1.3; }
    
    .options-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }
    .option-btn {
      background: white; border: 3px solid #e2e8f0; border-radius: 20px; padding: 20px;
      font-size: 1.8rem; font-weight: bold; color: var(--text-main); cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05); transition: all 0.2s ease;
    }
    .option-btn:active { transform: scale(0.96); }

    .feedback-msg { font-size: 1.5rem; font-weight: bold; text-align: center; height: 30px; margin-top: 20px; transition: 0.3s; }
    .feedback-msg.correct { color: #48bb78; }
    .feedback-msg.wrong { color: #ed8936; }

    /* --- RESULT SCREEN --- */
    .result-content { text-align: center; margin: auto 0; }
    .result-stars { font-size: 4rem; margin: 20px 0; letter-spacing: 10px; }
    .result-title { font-size: 2.5rem; margin-bottom: 10px; }
    .result-subtitle { font-size: 1.2rem; color: var(--text-light); margin-bottom: 30px; }
    
    .btn-primary { background: #4299e1; color: white; border: none; padding: 15px 30px; border-radius: 16px; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4); }
    .btn-secondary { background: #edf2f7; color: #4a5568; border: none; padding: 15px 30px; border-radius: 16px; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; }

    /* --- WATERMARK --- */
    .watermark { text-align: center; padding: 15px; font-size: 0.85rem; color: #cbd5e0; font-weight: bold; letter-spacing: 1px; margin-top: auto; }

    /* --- ANIMATIONS --- */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes gentleShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    
    .anim-correct { background: #c6f6d5 !important; border-color: #48bb78 !important; animation: pop 0.4s ease; color: #22543d; }
    .anim-wrong { background: #feebc8 !important; border-color: #ed8936 !important; animation: gentleShake 0.4s ease; color: #7b341e; }
    
    @media (max-width: 480px) {
      .level-grid { grid-template-columns: repeat(3, 1fr); }
      .question-text { font-size: 2rem; }
      .option-btn { font-size: 1.5rem; padding: 15px; }
    }
  </style>
</head>
<body>

<div id="app-container">

  <!-- SCREEN: HOME -->
  <div id="screen-home" class="screen active">
    <div class="hero-icon">🌟</div>
    <h1>Zyluna Kids</h1>
    <div class="subtitle">Belajar sambil bermain!</div>
    
    <div style="margin-top: 20px;">
      <div class="category-card math" onclick="goToLevels('math')">
        <div class="cat-icon">📘</div>
        <div class="cat-info"><h2>Matematika</h2><p>Yuk berhitung!</p></div>
      </div>
      <div class="category-card english" onclick="goToLevels('english')">
        <div class="cat-icon">🔤</div>
        <div class="cat-info"><h2>Bahasa Inggris</h2><p>Let's learn English!</p></div>
      </div>
      <div class="category-card basic" onclick="goToLevels('basic')">
        <div class="cat-icon">🌱</div>
        <div class="cat-info"><h2>Pengetahuan</h2><p>Yuk kenali dunia!</p></div>
      </div>
    </div>
    <div class="watermark">by Zyluna Arts</div>
  </div>

  <!-- SCREEN: LEVEL SELECT -->
  <div id="screen-levels" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goToHome()">◀ Kembali</button>
      <h2 id="level-title" style="font-size: 1.3rem;">Level</h2>
      <div style="width: 80px;"></div> <!-- Spacer -->
    </div>
    <div id="level-grid" class="level-grid"></div>
    <div class="watermark">by Zyluna Arts</div>
  </div>

  <!-- SCREEN: GAMEPLAY -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="quitGame()">✖ Keluar</button>
      <div id="game-level-indicator" style="font-weight: bold; font-size: 1.2rem; color: #4a5568;">Level 1</div>
      <div style="width: 80px;"></div>
    </div>
    <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
    
    <div class="question-container">
      <div id="question-text" class="question-text">1 + 1 = ?</div>
      <div id="options-grid" class="options-grid"></div>
      <div id="feedback-msg" class="feedback-msg"></div>
    </div>
  </div>

  <!-- SCREEN: RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-content">
      <div class="result-title">Level Selesai! 🎉</div>
      <div id="result-stars" class="result-stars">⭐⭐⭐</div>
      <div id="result-subtitle" class="result-subtitle">Hebat! Kamu berhasil menyelesaikannya.</div>
      
      <button class="btn-primary" onclick="nextLevel()">Lanjut Level Berikutnya</button>
      <button class="btn-secondary" onclick="goToLevels(currentCategory)">Kembali ke Menu</button>
    </div>
    <div class="watermark">by Zyluna Arts</div>
  </div>

</div>

<script>
  // --- STATE MANAGEMENT ---
  const totalLevels = 20;
  const questionsPerLevel = 5;
  
  let currentCategory = '';
  let currentLevel = 1;
  let currentQuestions = [];
  let currentQIndex = 0;
  let mistakes = 0;
  let isAnimating = false;

  // Initialize Progress in LocalStorage
  function loadProgress() {
    let p = localStorage.getItem('zyluna_kids_progress');
    if (!p) {
      p = {
        math: [0], english: [0], basic: [0] // 0 means unlocked but 0 stars. -1 is locked.
      };
      // Lock levels 2-20
      for(let i=1; i<totalLevels; i++) {
        p.math.push(-1); p.english.push(-1); p.basic.push(-1);
      }
      saveProgress(p);
      return p;
    }
    return JSON.parse(p);
  }
  function saveProgress(p) { localStorage.setItem('zyluna_kids_progress', JSON.stringify(p)); }

  // --- NAVIGATION ---
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function goToHome() { showScreen('screen-home'); }
  
  function goToLevels(category) {
    currentCategory = category;
    const titles = { math: '📘 Matematika', english: '🔤 B. Inggris', basic: '🌱 Pengetahuan' };
    const colors = { math: '#4299e1', english: '#9f7aea', basic: '#48bb78' };
    
    document.getElementById('level-title').innerText = titles[category];
    document.getElementById('level-title').style.color = colors[category];
    
    const progress = loadProgress()[category];
    const grid = document.getElementById('level-grid');
    grid.innerHTML = '';

    for (let i = 0; i < totalLevels; i++) {
      const status = progress[i]; // -1 (locked), 0 (unlocked, no star), 1-3 (stars)
      const btn = document.createElement('button');
      btn.className = 'level-btn';
      
      if (status === -1) {
        btn.innerHTML = `🔒`;
      } else {
        btn.classList.add('unlocked');
        let stars = '';
        if(status > 0) stars = '⭐'.repeat(status) + '⬛'.repeat(3-status).replace(/⬛/g, '<span style="opacity:0.2">⭐</span>');
        btn.innerHTML = `${i + 1}<div class="stars-display">${stars}</div>`;
        btn.onclick = () => startGame(i + 1);
      }
      grid.appendChild(btn);
    }
    showScreen('screen-levels');
  }

  function quitGame() { goToLevels(currentCategory); }

  // --- QUESTION GENERATORS ---
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

  function generateMathQuestion(lvl) {
    let a, b, op, ans, q;
    if (lvl <= 5) { // Addition up to 10
      a = randInt(1, 5); b = randInt(1, 5); op = '+'; ans = a + b;
    } else if (lvl <= 10) { // Subtraction up to 10
      a = randInt(5, 10); b = randInt(1, a - 1); op = '-'; ans = a - b;
    } else if (lvl <= 15) { // Addition up to 20
      a = randInt(6, 12); b = randInt(5, 8); op = '+'; ans = a + b;
    } else { // Mixed up to 20
      if(Math.random() > 0.5) {
        a = randInt(10, 15); b = randInt(2, 5); op = '+'; ans = a + b;
      } else {
        a = randInt(12, 20); b = randInt(1, 9); op = '-'; ans = a - b;
      }
    }
    q = `${a} ${op} ${b} = ?`;
    
    // Generate wrong options
    let opts = new Set([ans]);
    while(opts.size < 3) {
      let offset = randInt(-3, 3);
      if(offset !== 0 && ans + offset > 0) opts.add(ans + offset);
    }
    return { q, options: shuffle([...opts]), ans };
  }

  const vocabEnglish = [
    {q: "Apa bahasa Inggrisnya 'Kucing'?", img:"🐱", a:"Cat", w:["Dog", "Bird", "Cow"]},
    {q: "Apa warna Matahari?", img:"☀️", a:"Yellow", w:["Blue", "Green", "Red"]},
    {q: "Apa bahasa Inggrisnya 'Buku'?", img:"📖", a:"Book", w:["Pencil", "Bag", "Eraser"]},
    {q: "Berapa jumlah jarimu?", img:"✋", a:"Five", w:["Four", "Six", "Ten"]},
    {q: "Buah apakah ini?", img:"🍎", a:"Apple", w:["Banana", "Orange", "Grape"]},
    {q: "Apa bahasa Inggrisnya 'Susu'?", img:"🥛", a:"Milk", w:["Water", "Juice", "Tea"]},
    {q: "Hewan apa yang bisa terbang?", img:"🦅", a:"Bird", w:["Fish", "Cat", "Dog"]},
    {q: "Warna langit adalah...", img:"☁️", a:"Blue", w:["Red", "Yellow", "Black"]},
    {q: "Satu ditambah dua sama dengan...", img:"1+2", a:"Three", w:["Two", "Four", "Five"]},
    {q: "Apa bahasa Inggrisnya 'Ayah'?", img:"👨", a:"Father", w:["Mother", "Brother", "Sister"]}
  ];

  const vocabBasic = [
    {q: "Hewan apa yang bersuara 'Meong'?", img:"?", a:"Kucing", w:["Anjing", "Ayam", "Kambing"]},
    {q: "Kita melihat menggunakan...", img:"👀", a:"Mata", w:["Hidung", "Telinga", "Mulut"]},
    {q: "Manakah yang merupakan buah?", img:"?", a:"Pisang 🍌", w:["Bayam 🥬", "Wortel 🥕", "Susu 🥛"]},
    {q: "Sebelum makan kita harus...", img:"🍽️", a:"Cuci Tangan", w:["Tidur", "Lari", "Menangis"]},
    {q: "Benda apa yang dipakai di kepala?", img:"🧢", a:"Topi", w:["Sepatu", "Kaos Kaki", "Sabuk"]},
    {q: "Matahari terbit di waktu...", img:"🌅", a:"Pagi", w:["Malam", "Sore", "Hujan"]},
    {q: "Hewan apa yang menghasilkan susu?", img:"🥛", a:"Sapi", w:["Ayam", "Burung", "Semut"]},
    {q: "Rasa gula adalah...", img:"🍬", a:"Manis", w:["Pahit", "Asin", "Pedas"]},
    {q: "Ikan bernapas di dalam...", img:"🐟", a:"Air", w:["Tanah", "Udara", "Pasir"]},
    {q: "Kendaraan beroda dua adalah...", img:"?", a:"Sepeda 🚲", w:["Mobil 🚗", "Pesawat ✈️", "Kapal 🚢"]}
  ];

  function generateVocabQuestion(bank) {
    const item = bank[randInt(0, bank.length - 1)];
    const wrongSelected = shuffle(item.w).slice(0, 2);
    const options = shuffle([item.a, ...wrongSelected]);
    return { q: item.q + (item.img !== '?' ? `<br><span style="font-size:4rem">${item.img}</span>` : ''), options, ans: item.a };
  }

  // --- GAME LOGIC ---
  function startGame(level) {
    currentLevel = level;
    currentQIndex = 0;
    mistakes = 0;
    currentQuestions = [];
    
    // Generate 5 questions
    for(let i=0; i<questionsPerLevel; i++) {
      if(currentCategory === 'math') currentQuestions.push(generateMathQuestion(level));
      else if(currentCategory === 'english') currentQuestions.push(generateVocabQuestion(vocabEnglish));
      else currentQuestions.push(generateVocabQuestion(vocabBasic));
    }
    
    document.getElementById('game-level-indicator').innerText = `Level ${level}`;
    showScreen('screen-game');
    loadQuestion();
  }

  function loadQuestion() {
    isAnimating = false;
    const qData = currentQuestions[currentQIndex];
    document.getElementById('question-text').innerHTML = qData.q;
    
    const progressPct = (currentQIndex / questionsPerLevel) * 100;
    document.getElementById('progress-bar').style.width = `${progressPct}%`;
    document.getElementById('feedback-msg').innerText = '';
    
    const optsGrid = document.getElementById('options-grid');
    optsGrid.innerHTML = '';
    
    qData.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = opt;
      btn.onclick = () => checkAnswer(btn, opt, qData.ans);
      optsGrid.appendChild(btn);
    });
  }

  function checkAnswer(btn, selected, correct) {
    if(isAnimating) return;
    isAnimating = true;
    
    const msg = document.getElementById('feedback-msg');
    
    if (selected === correct) {
      btn.classList.add('anim-correct');
      msg.className = 'feedback-msg correct';
      msg.innerText = "Hebat! 🎉";
      
      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < questionsPerLevel) {
          loadQuestion();
        } else {
          finishLevel();
        }
      }, 1000);
    } else {
      mistakes++;
      btn.classList.add('anim-wrong');
      msg.className = 'feedback-msg wrong';
      msg.innerText = "Coba lagi! 😊";
      
      setTimeout(() => {
        btn.classList.remove('anim-wrong');
        isAnimating = false;
      }, 800);
    }
  }

  function finishLevel() {
    document.getElementById('progress-bar').style.width = '100%';
    
    // Calculate Stars
    let stars = 3;
    if (mistakes >= 1 && mistakes <= 2) stars = 2;
    else if (mistakes > 2) stars = 1;
    
    // Save Progress
    let p = loadProgress();
    if(p[currentCategory][currentLevel - 1] < stars) {
      p[currentCategory][currentLevel - 1] = stars; 
    }
    // Unlock next level if locked
    if (currentLevel < totalLevels && p[currentCategory][currentLevel] === -1) {
      p[currentCategory][currentLevel] = 0;
    }
    saveProgress(p);

    // Show Result UI
    document.getElementById('result-stars').innerText = '⭐'.repeat(stars) + '⬛'.repeat(3-stars).replace(/⬛/g, '<span style="opacity:0.2">⭐</span>');
    
    setTimeout(() => { showScreen('screen-result'); }, 500);
  }

  function nextLevel() {
    if (currentLevel < totalLevels) {
      startGame(currentLevel + 1);
    } else {
      goToLevels(currentCategory);
    }
  }
</script>
</body>
</html>
